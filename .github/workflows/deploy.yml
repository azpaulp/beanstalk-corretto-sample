name: Deploy to Elastic Beanstalk

on:
  push:
    branches: [main, master]

env:
  AWS_REGION: us-east-1
  APPLICATION_NAME: beanstalk-corretto-sample
  ENVIRONMENT_NAME: beanstalk-corretto-sample-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean package

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/aws-elasticbeanstalk-deploy@v1.0.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          application-name: ${{ env.APPLICATION_NAME }}
          environment-name: ${{ env.ENVIRONMENT_NAME }}
          deployment-package-path: target/sample-app-1.0.jar
          solution-stack-name: '64bit Amazon Linux 2023 v4.8.3 running Corretto 17'
          option-settings: |
            [
              {
                "Namespace": "aws:autoscaling:launchconfiguration",
                "OptionName": "IamInstanceProfile",
                "Value": "aws-elasticbeanstalk-ec2-role"
              },
              {
                "Namespace": "aws:elasticbeanstalk:environment",
                "OptionName": "ServiceRole",
                "Value": "arn:aws:iam::092219053053:role/service-role/aws-elasticbeanstalk-service-role"
              }
            ]
